name: Temporary lock generation
on:
  push:
    branches: [maintenance/refresh-python-locks]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-tools==7.7.0
      - name: Regenerate production and development locks
        run: |
          pip-compile --upgrade --generate-hashes --no-strip-extras --no-header --annotation-style=line -o requirements.txt requirements.in
          pip-compile --upgrade --generate-hashes --no-strip-extras --no-header --annotation-style=line -o requirements-dev.txt requirements-dev.in
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("requirements.txt", "requirements-dev.txt"):
              data = Path(name).read_bytes()
              print("LOCK_START", name, hashlib.sha256(data).hexdigest())
              for line in data.decode().splitlines(keepends=True):
                  import json
                  print("LOCK_LINE", json.dumps(line))
              print("LOCK_END", name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-locks
          path: |
            requirements.txt
            requirements-dev.txt
          retention-days: 1
